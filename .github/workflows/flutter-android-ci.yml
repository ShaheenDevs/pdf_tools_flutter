name: Flutter Android CI

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - '.github/workflows/flutter-android-ci.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: flutter-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android .

      - name: Align Android Gradle Plugin with Flutter
        run: |
          find android -type f -name '*.gradle*' -exec sed -i 's/9[.]1[.]0/9.1.1/g' {} +
          grep -R -q '9.1.1' android --include='*.gradle*'

      - name: Remove generated Flutter counter test
        run: rm -f test/widget_test.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate Stacked files
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Commit generated Android and Stacked files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android pubspec.lock lib/app/app.locator.dart lib/app/app.router.dart lib/database/app_database.g.dart
          if git diff --cached --quiet; then
            echo "No generated files changed."
          else
            git commit -m "chore: persist generated Android, dependency lock, and Stacked files [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
